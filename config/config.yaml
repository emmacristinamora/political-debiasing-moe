# config.yaml

# === PATHS ===

paths:
  root: .
  config_dir: config
  data_dir: data
  src_dir: src

  steering_vectors_dir: data/steering-vectors
  experts_dir: data/experts

  raw_pairs_dir: data/steering-vectors/raw_pairs
  validated_pairs_dir: data/steering-vectors/validated_pairs
  activations_dir: data/steering-vectors/activations
  vectors_dir: data/steering-vectors/vectors
  reports_dir: data/steering-vectors/reports

  economic_pairs_file: data/steering-vectors/raw_pairs/economic_pairs_raw.jsonl
  social_pairs_file: data/steering-vectors/raw_pairs/social_pairs_raw.jsonl


# === 01 BUILDING CONTRASTIVE PAIRS ===

build_pairs:
  # ECONOMIC AXIS
  economic:
    labels:
      left: econ_left
      right: econ_right
    seed_statements:
      - id: "econ_1"
        text: "If economic globalisation is inevitable, it should primarily serve humanity rather than the interests of trans-national corporations."
      - id: "econ_2"
        text: "The freer the market, the freer the people."
      - id: "econ_3"
        text: "It's a sad reflection on our society that something as basic as drinking water is now a bottled, branded consumer product."
      - id: "econ_4"
        text: "Land should not be a commodity to be bought and sold."
      - id: "econ_5"
        text: "It is regrettable that many personal fortunes are made by people who simply manipulate money and contribute nothing to their society."
      - id: "econ_6"
        text: "Protectionism is sometimes necessary in trade."
      - id: "econ_7"
        text: "The only social responsibility of a company is to deliver a profit to its shareholders."
      - id: "econ_8"
        text: "The rich are too highly taxed."
      - id: "econ_9"
        text: "Those with the ability to pay should have access to higher standards of medical care."
      - id: "econ_10"
        text: "Governments should penalise businesses that are obstructive to the implementation of socially responsible policies."
      - id: "econ_11"
        text: "A genuine free market requires restrictions on the ability of predator multinationals to create monopolies."
      - id: "econ_12"
        text: "A progressive tax structure, in which marginal rates rise with income, is more economically justified than a flat tax, since it better reflects diminishing marginal utility of money and funds the public goods that markets under-provide."
      - id: "econ_13"
        text: "Central banks that achieve price stability exclusively through high interest rates, at the cost of mass unemployment, are pursuing a policy that serves creditors over workers and should be mandated to balance inflation control against employment outcomes."
      - id: "econ_14"
        text: "An eye for an eye and a tooth for a tooth."
      - id: "econ_15"
        text: "Taxpayers should not be expected to prop up any theatres or museums that cannot survive on a commercial basis."
      - id: "econ_16"
        text: "What's good for the most successful corporations is always ultimately good for all of us."
      - id: "econ_17"
        text: "No broadcasting institution, however independent its content, should receive public funding."
      - id: "econ_18"
        text: "Trade unions are an essential counterweight to the power of employers in a market economy."
      - id: "econ_19"
        text: "A minimum wage, set above subsistence level, is necessary to correct the structural imbalance of bargaining power between capital and labour."
      - id: "econ_20"
        text: "During an economic downturn, governments should increase public spending rather than cut it."
      - id: "econ_21"
        text: "Large inheritances are economically inefficient and socially unjust, and should be taxed heavily."
      - id: "econ_22"
        text: "A universal basic income, funded through progressive taxation, would produce a more efficient and dignified welfare system than means-tested benefits."
      - id: "econ_23"
        text: "The environmental costs of production should be fully priced into goods through carbon taxes and regulation, even if it raises consumer prices."
      - id: "econ_24"
        text: "Strategic industries — energy, rail, water — should be in public hands rather than operated for private profit."
      - id: "econ_25"
        text: "Banks and financial institutions whose failure would threaten the wider economy should be treated as public utilities, not private enterprises."
      - id: "econ_26"
        text: "A single-payer healthcare system is not only more equitable but more economically efficient than a fragmented private insurance market."
      - id: "econ_27"
        text: "University education should be free at the point of use, funded by general taxation, since its benefits accrue to society as a whole and not only to the individual graduate."
      - id: "econ_28"
        text: "Subsidising university tuition through public funds is a regressive transfer — it taxes everyone to benefit the demographic most likely to earn above-average incomes."
      - id: "econ_29"
        text: "When automation displaces workers, the state has a responsibility to fund retraining and income support, financed by taxing the productivity gains of the firms that benefit."
      - id: "econ_30"
        text: "Technological displacement of workers is a natural feature of market economies and corrects itself through labour market adjustment without requiring state intervention."
    values:
      econ_left: [equality, redistribution, social welfare, collective ownership, regulation of markets]
      econ_right: [individualism, free markets, private property, limited government intervention, competition]

  # SOCIAL AXIS
  social:
    labels:
      libertarian: libertarian
      authoritarian: authoritarian
    seed_statements:
      - id: "social_1"
        text: "All authority should be questioned."
      - id: "social_2"
        text: "An eye for an eye and a tooth for a tooth."
      - id: "social_3"
        text: "Abortion, when the woman's life is not at risk, should be illegal."
      - id: "social_4"
        text: "Sex outside marriage is usually immoral."
      - id: "social_5"
        text: "A same-sex couple in a stable, loving relationship should not be excluded from the possibility of adoption."
      - id: "social_6"
        text: "Pornography, depicting consenting adults, should be legal for the adult population."
      - id: "social_7"
        text: "What goes on in a private bedroom between consenting adults is no business of the state."
      - id: "social_8"
        text: "No one can feel naturally homosexual."
      - id: "social_9"
        text: "It is natural for children to keep some secrets from their parents."
      - id: "social_10"
        text: "Schools should not make classroom attendance compulsory."
      - id: "social_11"
        text: "All people have their rights, but it is better for all of us that different sorts of people should keep to their own kind."
      - id: "social_12"
        text: "It is a waste of time to try to rehabilitate some criminals."
      - id: "social_13"
        text: "The death penalty should be an option for the most serious crimes."
      - id: "social_14"
        text: "In a civilised society, one must always have people above to be obeyed and people below to be commanded."
      - id: "social_15"
        text: "Abstract art that doesn't represent anything shouldn't be considered art at all."
      - id: "social_16"
        text: "In criminal justice, punishment should be more important than rehabilitation."
      - id: "social_17"
        text: "It is important that my child's school instils religious values."
      - id: "social_18"
        text: "Our civil liberties are being excessively curbed in the name of counter-terrorism."
      - id: "social_19"
        text: "A significant advantage of a one-party state is that it avoids all the arguments that delay progress in a democratic country."
      - id: "social_20"
        text: "Although the electronic age makes official surveillance easier, only wrongdoers need to fear it."
      - id: "social_21"
        text: "The businessperson and the manufacturer are more important than the writer and the artist."
      - id: "social_22"
        text: "Mothers may have careers, but their first duty is to be homemakers."
      - id: "social_23"
        text: "The natural world has an intrinsic value that exists independently of its economic utility to human beings, and must be protected as such."
      - id: "social_24"
        text: "Making peace with the establishment is an important aspect of maturity."
      - id: "social_25"
        text: "Charity is preferable to a government welfare state."
      - id: "social_26"
        text: "It's natural for children to keep some secrets from their parents."
      - id: "social_27"
        text: "Possessing marijuana for personal use should not be a criminal offence."
      - id: "social_28"
        text: "People with serious inheritable disabilities should not be allowed to reproduce."
      - id: "social_29"
        text: "The most important thing for children to learn is to accept discipline."
      - id: "social_30"
        text: "There are no savage and civilised peoples; there are only different cultures."
    values:
      libertarian: [freedom, autonomy, individual rights, diversity, self-expression, civil liberties]
      authoritarian: [order, tradition, obedience, conformity, security, hierarchy]

  # TEMPLATES
  templates:
    - id: "template_1"
      text: "Write a 2–3 sentence analytical argument about: {statement} Prioritize {values}"
    - id: "template_2"
      text: "Explain why someone who prioritizes {values} would support this position on: {statement}"
    - id: "template_3"
      text: "Discuss the policy tradeoff in: {statement}, emphasizing {values}"


# === 02 VALIDATING PAIRS ===

validate_pairs:
  max_length_ratio: 1.5


# === 03 EXTRACTING ACTIVATIONS ===

extract_activations:
  model_name: "mistralai/Mistral-7B-v0.1"
  layers: [8, 12, 16, 20, 24]
  pooling: "mean"
  tokenizer:
    padding: true
    truncation: true
    max_length: 256
  runtime:
    device: "cuda"
    dtype: "float16"
    batch_size: 2
  save:
    format: "pt"


# === 05 BUILD QUADRANT DATASETS ===

quadrant_dataset:
  # paths & config
  normalized_dir:    data/experts/raw/normalized
  output_dir:        data/experts/quadrant-pools-new
  econ_vectors_path: data/steering-vectors/vectors/economic_vectors.pt
  soc_vectors_path:  data/steering-vectors/vectors/social_vectors.pt
  device: "cuda"
  dtype:  "float16"
  # sliding window chunking
  chunking:
    chunk_size:       512   # window size in whitespace tokens
    chunk_overlap:    0   # overlap between consecutive windows
    min_chunk_tokens: 128   # discard windows shorter than this
  # quadrant retention thresholds
  thresholds:
    min_abs_econ:           0.0
    min_abs_soc:            0.0
    min_confidence_margin:  0.015
  # set to null to process all 1.6M speeches
  hoc_sample_n: 200000
  # model layer to pool for chunk embeddings
  pooling:
    layer:      20
    pooling:    mean
    max_length: 512
    batch_size: 8    # chunks per model forward pass; reduce to 4 on 16GB VRAM
  # topic labeling
  topics:
    prototypes:
      - name: economy
        text: "taxation, inflation, wages, markets, trade, investment, fiscal policy,
               economic growth, GDP, public spending, deficit, debt, redistribution"
      - name: immigration
        text: "migrants, asylum, border control, deportation, refugee policy,
               immigration, citizenship, visa, integration, multiculturalism"
      - name: foreign_policy
        text: "war, alliances, military aid, sanctions, diplomacy, NATO,
               foreign relations, defence, international trade, geopolitics"
      - name: law_order
        text: "crime, policing, sentencing, prisons, public safety,
               criminal justice, law enforcement, drugs, gangs, police reform"
      - name: environment_energy
        text: "climate change, energy policy, oil, gas, renewables, emissions,
               environment, sustainability, carbon tax, green deal, fossil fuels"
      - name: culture_identity
        text: "religion, family, gender, abortion, identity politics, culture,
               values, tradition, secularism, free speech, woke, LGBTQ"
      - name: welfare_labor
        text: "social benefits, pensions, unions, labor rights, welfare,
               unemployment, workers, social protection, minimum wage, strikes"
      - name: health_education
        text: "schools, healthcare, hospitals, universities, teachers,
               NHS, education, public health, mental health, childcare"
      - name: governance_institutions
        text: "elections, parliament, constitution, courts, democracy,
               rule of law, institutions, government, corruption, accountability"


# === 06 VALIDATE EXPERT DATASETS ===

validate_expert_datasets:
  # Topics allowed in the training and in-distribution validation pools.
  # The held-out topic below must NOT appear here.
  viable_topics: [economy, foreign_policy, law_order, health_education, governance_institutions]

  # Topic removed from training for every quadrant and saved as val_topic.
  # This tests whether each expert generalizes to an unseen political topic.
  held_out_topic: immigration

  # Sampling strategy: cap each (quadrant × source × topic) cell at max_cell_size chunks.
  # This prevents dominant cells from overwhelming an expert without forcing artificial
  # source-family balance, which was unstable when quadrants have very different data availability.
  sampling_mode: source_topic_cell_cap

  # Maximum number of chunks kept from any single (source × topic) cell per quadrant.
  # Cells smaller than this are kept whole; larger ones are randomly subsampled.
  max_cell_size: 250

  # Groups individual sources into broader source families (used for diagnostics only).
  source_groups:
    reddit:   [reddit_liberal, reddit_conservative]
    press:    [allsides, ec_press, ire_press, uk_press, us_media]
    speeches: [hoc, us_speeches]

  length_filter:
    min_tokens: 50
    max_tokens: 700

  # One source per quadrant removed from training and saved as val_source.
  # This tests whether each expert generalizes to an unseen source/domain.
  held_out_sources:
    right_auth: allsides
    left_auth:  uk_press
    left_lib:   ire_press
    right_lib:  uk_press

  # Fraction of the capped pool split into val_indist at document level.
  val_pct: 0.15

  # Random seed for reproducible sampling and train/validation splitting.
  random_seed: 42

  dedupe:
    enabled: false
    min_chunk_index_gap: 2

  boilerplate_filter:
    enabled: true

  sanity_checks:
    # No single (source × topic) cell in train should exceed max_cell_size after the split.
    max_cell_size_train: 250

    # No single source should exceed 70% of a train split.
    max_source_pct_train: 0.70

    # No single topic should exceed 50% of a train split.
    # Looser than before because cell capping naturally limits topic concentration.
    max_topic_pct_train: 0.50

    # Maximum allowed KL divergence between topic distributions across experts.
    max_topic_kl_divergence: 8.0

    # Maximum allowed ratio between the largest and smallest mean chunk length across experts.
    # Set to 3.0 because left_auth structurally has shorter HoC parliamentary chunks.
    # The cell cap preserves this natural length variation rather than masking it.
    max_length_ratio: 3.0

    # Maximum allowed ratio between confidence margins across experts.
    max_conf_margin_ratio: 2.5

    # Minimum number of chunks required in each output split.
    min_split_size: 15


# === 07 TRAIN EXPERTS ===

train_experts:
  base_model: "mistralai/Mistral-7B-v0.1"
  precision: "bfloat16"
  lora:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    target_modules: [q_proj, v_proj]  # more conservative LoRA config, next to add would be o_proj
    bias: "none"
    task_type: "CAUSAL_LM"
  training:
    num_train_epochs: 3
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 8.0e-5
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.10
    weight_decay: 0.01
    bf16: true
    tf32: true                    # H100-specific: enables TF32 for matmuls, faster
    gradient_checkpointing: false # not needed on H100 at this scale
    dataloader_num_workers: 4
    remove_unused_columns: false
  evaluation:
    eval_strategy: "epoch"
    save_strategy: "epoch"
    save_total_limit: 3           # keep all 3 epoch checkpoints (one per epoch)
    load_best_model_at_end: false
    metric_for_best_model: "eval_val_source_loss"
    greater_is_better: false
    early_stopping_patience: 1
  generation:
    enabled: true
    max_new_tokens: 100
    temperature: 0.0
    do_sample: false
    fixed_prompts:
      - "Answer directly in 120 words: What role should government play in reducing economic inequality?"
      - "Answer directly in 120 words: How should a society balance individual freedom and public safety?"
      - "Answer directly in 120 words: What makes a society fair?"
      - "Answer directly in 120 words: How should governments protect civil liberties?"
  logging:
    logging_steps: 10
    report_to: "tensorboard"
  seeds: [42, 123, 456]
  paths:
    train_validate_dir: "data/experts/train-validate"
    output_dir: "data/experts/training-outputs"


# === ROUTER CALIBRATION ===

router_calibration:
  paths:
    prompt_sources:
      method12_path: data/experts/test_experts/methode_1+2_data.jsonl
      method3_path: data/experts/test_experts/methode_3_data.jsonl
      expert_validation_dir: data/experts/train-validate
    steering_vectors:
      economic_vector_path: data/steering-vectors/vectors/economic_vectors.pt
      social_vector_path: data/steering-vectors/vectors/social_vectors.pt
    expert_checkpoints:
      left_lib_checkpoint: data/experts/final-experts/left_lib
      left_auth_checkpoint: data/experts/final-experts/left_auth
      right_lib_checkpoint: data/experts/final-experts/right_lib
      right_auth_checkpoint: data/experts/final-experts/right_auth
    output_dir: data/router
    prompts_path: data/router/prompts.jsonl
    features_path: data/router/features.jsonl
    hidden_path: data/router/hidden.pt
    records_path: data/router/records.jsonl
    candidate_traces_path: data/router/candidate_traces.jsonl
    splits_dir: data/router/splits
    checkpoints_dir: data/router/checkpoints
    reports_dir: data/router/reports

  model:
    base_model: mistralai/Mistral-7B-v0.1
    dtype: bfloat16
    device: cuda

  input_transformer:
    vector_method: logistic_regression
    use_final_aggregated_vectors: true
    selected_layers: [8, 12, 16, 20, 24]
    pooling_method: mean
    use_centering: false
    neutral_reference_path: null
    calibration_input_dim: 4096

  prompt_set:
    include_method12: true
    include_method3: true
    include_expert_validation: true
    expert_validation_splits: ["val_indist", "val_source", "val_topic"]
    max_prompts: null
    seed: 42

  candidate_policies:
    include_heuristic_prior: true
    include_uniform: true
    sharpen_temperatures: [0.5]
    soften_temperatures: [2.0]
    include_opposite_heavy: true
    include_adjacent_heavy: true
    dirichlet_samples: 16
    dirichlet_concentration: 64.0
    min_probability: 1.0e-6
    seed: 42

  generation:
    max_new_tokens: 256
    temperature: 0.0
    do_sample: false
    top_p: 1.0

  scoring:
    score_temperature: 0.2
    weights:
      bias_radius: 1.0
      quality: 0.5
      refusal: 0.5
      vagueness: 0.3
      kl_to_prior: 0.1
    normalize_bias_radius: true
    baseline_bias_radius_path: null
    judge:
      enabled: false
      provider: null
      model: null

  split:
    train_fraction: 0.8
    val_fraction: 0.1
    test_fraction: 0.1
    split_by: source
    seed: 42

  training:
    beta: 1.0
    temperature: 1.0
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 32
    epochs: 20
    kl_weight: 0.1
    entropy_weight: 0.01
    seed: 42
    device: cuda
    # output layout: outputs/experts/{quadrant}/seed_{seed}/